<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Meeting Meter</title>
<style>
:root{color-scheme:light dark;--bg:#faf7f0;--surface:#fff;--line:#e8e2d4;--fg:#1e293b;--muted:#334155;--navy:#14213d;--amber:#f5a524;--amber-ink:#8a5a00;--link:#14213d;--shadow:0 1px 2px rgba(20,33,61,.06),0 8px 30px rgba(20,33,61,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1730;--surface:#14213d;--line:#2a3a5e;--fg:#f1ede3;--muted:#c3cadb;--amber-ink:#f5a524;--link:#f5a524;--shadow:0 8px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link)}a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:40px 16px 24px}
h1{margin:12px 0 4px;font-size:38px;line-height:1.15;letter-spacing:-.02em}h2{margin:36px 0 10px;font-size:23px}
p,li{color:var(--muted)}
.hero{background:var(--navy);color:#faf7f0;border-radius:24px;padding:40px 24px;text-align:center;box-shadow:var(--shadow)}
.hero h1{color:#faf7f0}.hero p{color:#cdd3e2;max-width:540px;margin:8px auto}
.tag{font-size:20px;color:var(--amber)!important;font-weight:600}
.money{font-variant-numeric:tabular-nums;color:var(--amber);font-size:34px;font-weight:700;margin:16px 0 0!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);margin:0 0 12px}
.card strong{display:block;color:var(--fg)}
footer{max-width:720px;margin:0 auto;padding:16px 16px 48px;border-top:1px solid var(--line);font-size:14px;text-align:center}footer a{margin:0 8px;display:inline-block}
</style>
<style>body{min-height:100vh;display:flex;align-items:center;justify-content:center}.thanks{max-width:460px;margin:16px;padding:36px 32px;text-align:center}.thanks h1{color:#faf7f0;font-size:30px}.heart{font-size:40px;color:var(--amber);line-height:1}</style>
</head>
<body>
  <main class="hero thanks">
    <svg viewBox="0 0 32 32" width="72" height="72" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1c2c52"/><path d="M7.5 20a8.5 8.5 0 0 1 17 0" fill="none" stroke="#f5a524" stroke-width="3" stroke-linecap="round"/><path d="M16 20l5-4.2" stroke="#faf7f0" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="20" r="2.4" fill="#f5a524"/></svg>
    <div class="heart" aria-hidden="true">❤</div>
    <h1>Thank you!</h1>
    <p>Your support keeps Meeting Meter free, ad-free and tracking-free.</p>
    <p>If the extension is installed, a small "Supporter ❤" badge now appears in the popup, and it will stop asking.</p>
    <p>You can close this tab and get back to (fewer, shorter) meetings.</p>
  </main>
</body>
</html>
